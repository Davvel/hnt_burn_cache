<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HNT Daily Burn Cache</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 18px; line-height: 1.45; }
    code { background: #f2f2f2; padding: 2px 5px; border-radius: 4px; }
    .ok { font-weight: 700; }
    .stale { font-weight: 700; }
    table { border-collapse: collapse; width: 100%; margin-top: 18px; }
    td, th { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; }
  </style>
</head>
<body>
  <h1>HNT Daily Burn Cache</h1>
  <p id="summary">Loading…</p>

  <p>Public app endpoints:</p>
  <ul>
    <li><a href="latest-complete.json"><code>latest-complete.json</code></a> — latest completed UTC day</li>
    <li><a href="latest.json"><code>latest.json</code></a> — latest row returned by Dune</li>
    <li><a href="hnt-burn.json"><code>hnt-burn.json</code></a> — historical daily series</li>
    <li><a href="status.json"><code>status.json</code></a> — freshness/health</li>
  </ul>

  <h2>Recent days</h2>
  <table>
    <thead><tr><th>Date</th><th>HNT burned</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

<script>
(async () => {
  try {
    const r = await fetch('./hnt-burn.json', {cache: 'no-store'});
    const j = await r.json();

    document.getElementById('summary').textContent =
      `Status: ${j.status}. Latest available date: ${j.latest_available_date}. ` +
      `Generated: ${j.generated_at_utc}. Query: ${j.query_id}.`;

    const recent = [...j.data].slice(-14).reverse();
    const tbody = document.getElementById('rows');
    for (const row of recent) {
      const tr = document.createElement('tr');
      const d = document.createElement('td');
      const v = document.createElement('td');
      d.textContent = row.date;
      v.textContent = Number(row.hnt_burned).toLocaleString(undefined, {maximumFractionDigits: 6});
      tr.append(d, v);
      tbody.appendChild(tr);
    }
  } catch (e) {
    document.getElementById('summary').textContent = 'Cache not generated yet. Run the GitHub Action once.';
  }
})();
</script>
</body>
</html>
